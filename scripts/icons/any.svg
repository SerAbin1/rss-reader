<!--
	Source for the installable app icons (public/icon-192.png, icon-512.png).
	Not shipped: scripts/generate-icons.sh rasterizes this into public/, so the
	wordmark has exactly one place to be edited.

	The masthead's own font stack, so the icon and the h1 are the same lettering.
	No dark-mode variant: Android takes the rasterized PNG and never re-themes
	it, so a media query here would only make this file disagree with the icons
	it generates.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<rect width="512" height="512" fill="#faf8f4" />
	<text
		x="261"
		y="336"
		fill="#22201c"
		font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'URW Palladio L', Georgia, serif"
		font-size="230"
		font-style="italic"
		letter-spacing="-6"
		text-anchor="middle">RSS</text>
</svg>
