# Single source of truth for the Cloudflare project. Previously these values
# were split between the `pages:dev` flags in package.json (local) and the
# `pages deploy` flags in .github/workflows/deploy.yml plus the Cloudflare
# dashboard (production) — so local and production could silently run different
# runtime semantics. Both now read from here.

name = "my-rss-reader"
pages_build_output_dir = "dist"

# The Workers runtime gates breaking changes behind this date: it serves the
# semantics as of the date declared here, so a runtime update can't change
# behaviour under us. Bumping it is a deliberate opt-in to newer semantics.
compatibility_date = "2026-08-27"

# Cross-device reading-state sync. Create the database once with
#   pnpm exec wrangler d1 create rss-reader-sync
# and paste the returned id below — it is an identifier, not a secret, and is
# meant to be committed.
[[d1_databases]]
binding = "DB"
database_name = "rss-reader-sync"
database_id = "REPLACE_ME_AFTER_d1_create"
