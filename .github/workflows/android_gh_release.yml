name: Android GitHub release

# Push an android-v* tag to publish that exact version. Tests run on push to
# main via android_ci.yml; this workflow only makes releases.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (creates/targets no tag)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, so version codes are published in order.
    concurrency: android-release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${REF_NAME#android-v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be major.minor.patch, got: $version"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          if [ "$code" -le 10000 ]; then
            echo "::error::versionCode $code is not above the 1.0.0 baseline (10000)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The release APK packages librss_reader_core.so built from rust/.
      # ubuntu-latest ships with the NDK under $ANDROID_NDK_HOME; cargo-ndk finds it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Stay on the fully open-source path (MIT, wraps actions/cache)
          # instead of the proprietary gradle-actions-caching component.
          cache-provider: basic

      # Without the key Gradle would quietly fall back to the debug key, and an
      # APK signed with it can't update the installed app.
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          mv app/build/outputs/apk/release/app-release.apk "rss-reader-$VERSION.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "android-v$VERSION" "rss-reader-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Android $VERSION" \
            --notes "Built from $GITHUB_SHA: $(git log -1 --format=%s "$GITHUB_SHA")"

  # Republishes the F-Droid repo so the new release shows up there too.
  fdroid:
    needs: release
    uses: ./.github/workflows/fdroid_release.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
