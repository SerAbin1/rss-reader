name: Android

# Also on changes to what the app shares with the web side: the parser
# fixtures its tests read, and the curated list it bundles.
on:
  push:
    branches: [main]
    paths: ["android/**", "src/lib/__fixtures__/**", "public/curated-feeds.opml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/lib/__fixtures__/**", "public/curated-feeds.opml", ".github/workflows/android.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Every tested push to main becomes a GitHub release with a signed APK.
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, so tags and version codes are created in order.
    concurrency: android-release
    defaults:
      run:
        working-directory: android
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Without the key Gradle would quietly fall back to the debug key, and an
      # APK signed with it can't update the installed app.
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease -PbuildNumber=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk "rss-reader-$VERSION.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$VERSION" "rss-reader-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Android $VERSION" \
            --notes "Built from $GITHUB_SHA: $(git log -1 --format=%s "$GITHUB_SHA")"
