name: Android

# Also on changes to what the app shares with the web side: the parser
# fixtures its tests read, and the curated list it bundles.
on:
  push:
    branches: [main]
    paths: ["android/**", "src/lib/__fixtures__/**", "public/curated-feeds.opml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/lib/__fixtures__/**", "public/curated-feeds.opml", ".github/workflows/android.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
