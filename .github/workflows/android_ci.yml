name: Android CI

on:
  push:
    branches: [main]
    paths: ["android/**", "rust/**", "public/curated-feeds.opml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Stay on the fully open-source path (MIT, wraps actions/cache)
          # instead of the proprietary gradle-actions-caching component.
          cache-provider: basic

      - name: Test
        run: ./gradlew :app:testDebugUnitTest
