name: Web deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Sets up Node and pnpm at the versions package.json pins, and runs
      # `vp install` (frozen lockfile on CI).
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true

      - run: vp test run

      # Astro with the Cloudflare adapter: dist/client is the site, dist/server
      # the Worker, and .wrangler/deploy/config.json points wrangler at both.
      - run: vp run build

      # Ahead of the deploy, not after: the new code expects the new schema, so
      # applying it afterwards leaves a window where live requests 500. cf
      # takes the database's id, not its name (it's in wrangler.toml too).
      - name: Apply D1 migrations
        run: vp exec cf d1 migrations apply fcf7783c-890c-4916-83b9-ef090885fc1d
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler, not cf: `cf deploy` only takes cf's own build output, which
      # the Astro adapter can't produce yet. Switch once it can.
      - name: Deploy to Cloudflare Workers
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
